; Fehlerausgabe wie auf dem Zielserver.
;
; Statamic 3.4 bindet Laravel 8, und Laravel 8 ist auf PHP 8.4 nicht
; deprecation-frei. Allein das Autoloading von thecodingmachine/safe erzeugt
; 528 Meldungen, bevor der erste Test laeuft, und das Booten der Anwendung
; legt weitere nach.
;
; Zwei Stellschrauben, weil eine nicht reicht:
;
; error_reporting = 24575 ist E_ALL & ~E_DEPRECATED. Das faengt alles ab, was
; vor dem Start der Anwendung passiert. Laravel setzt den Wert beim Booten
; selbst auf -1 (Illuminate\Foundation\Bootstrap\HandleExceptions), deshalb
; genuegt es nicht allein.
;
; display_errors = Off faengt den Rest. Laravels Fehlerbehandler tut unter
; Tests mit Deprecations bewusst nichts und gibt null zurueck; dann druckt
; PHPs eigener Behandler sie, und unter beStrictAboutOutputDuringTests wird
; jeder Test dadurch "risky". Fehler im eigenen Code gehen weiterhin als
; Exception durch und lassen Tests scheitern, daran aendert das nichts.
;
; Beide Werte entsprechen der Produktion der GVOE-Seite (error_reporting 22527,
; display_errors Off), geprueft am 14.09.2026 im phpinfo. Hier wird also nichts
; stillgelegt, was dort meldet. Wer sehen will, was das eigene Paket auf einer
; neueren PHP-Version meldet, nimmt `composer test:deprecations`.
error_reporting = 24575
display_errors = Off

; log_errors ebenfalls aus: in einem Testcontainer nuetzt ein Deprecation-Log
; auf stderr niemandem, und es verdeckt die Ausgabe von PHPUnit. Echte Fehler
; kommen als Exception durch und lassen Tests scheitern, unabhaengig davon.
log_errors = Off
