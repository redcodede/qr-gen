  "nformation" am Stück aus "Informationen", mit den Abständen der Vorlage. Grundlinien und linke
  Kante sind die der deutschen Zeilen. Gesetzt am 17.11.2026.

  Ersetzt die deutsche Datei eine Vektorvorlage, ist diese hier aus derselben Schrift neu zu setzen.
